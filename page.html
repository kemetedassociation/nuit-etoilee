<title>Nuit Étoilée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Poppins:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
/* Layout : un ciel de nuit continu. Accueil = carte du ciel où chaque conte est une étoile ;
   conte = page de livret (affiche, audio, récit) ; épreuves = scène plein écran par-dessus. */
:root{
  --nuit:#0a0c13;        /* fond */
  --nuit-2:#121522;      /* surfaces */
  --nuit-3:#1b1f31;      /* surfaces actives */
  --or:#c9a45a;          /* accent (identité des livrets KEMETED) */
  --or-vif:#e6c27a;
  --or-doux:rgba(201,164,90,.28);
  --creme:#f3ead4;       /* titres */
  --texte:#ddd4bd;       /* courant */
  --sourdine:#9a8f74;    /* légendes */
  --trait:rgba(243,234,212,.12);
  --ok:#8fc7a0;
  --ko:#e0846f;
  --f-titre:"Lora", Georgia, "Times New Roman", serif;
  --f-script:"Pinyon Script", "Lora", Georgia, cursive;
  --f-label:"Poppins", "Helvetica Neue", Arial, sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--nuit);color:var(--texte)}
body{overflow-x:clip}
body{
  font-family:var(--f-titre);font-size:17px;line-height:1.65;min-height:100%;
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(80,60,120,.22), transparent 60%),
    radial-gradient(900px 600px at 0% 110%, rgba(201,164,90,.08), transparent 60%),
    var(--nuit);
  background-attachment:fixed;
}
#ciel-fond{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
a{color:var(--or-vif)}
button{font:inherit;color:inherit}
a,button,[role="button"],summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--or-vif);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;color:var(--creme);text-wrap:balance;margin:0}
.label{font-family:var(--f-label);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--or)}
.sourdine{color:var(--sourdine)}

/* ---- barre du haut ---- */
.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding-block:12px;margin-bottom:8px;background:linear-gradient(var(--nuit) 60%, transparent)}
.marque{white-space:nowrap;min-height:44px;align-items:center;font-family:var(--f-titre);color:var(--creme);text-decoration:none;font-size:18px;display:flex;gap:8px;align-items:baseline}
.marque span{font-family:var(--f-script);color:var(--or);font-size:22px}
.barre .esp{flex:1}
.pastille{font-family:var(--f-label);font-size:13px;letter-spacing:.04em;border:1px solid var(--trait);background:var(--nuit-2);
  border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pastille b{color:var(--or-vif);font-weight:600}
.pastille:hover{border-color:var(--or-doux)}

/* ---- boutons ---- */
.btn{font-family:var(--f-label);font-size:14px;font-weight:500;letter-spacing:.03em;border-radius:999px;padding:12px 22px;cursor:pointer;
  border:1px solid var(--or);background:var(--or);color:var(--nuit);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;transition:transform .15s, background .15s}
.btn:hover{background:var(--or-vif)}
.btn:active{transform:scale(.97)}
.btn.fantome{background:transparent;color:var(--or-vif)}
.btn.fantome:hover{background:var(--or-doux)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.rangee{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---- accueil ---- */
.hero{text-align:center;padding-block:28px 10px;display:grid;gap:14px;justify-items:center}
.hero h1{font-size:clamp(44px,9vw,76px);line-height:1;letter-spacing:.01em}
.hero .script{font-family:var(--f-script);color:var(--or);font-size:clamp(40px,8vw,64px);line-height:1;margin-top:-6px}
.hero p{max-width:58ch;margin:0;color:var(--texte)}
.sep{display:flex;gap:18px;color:var(--or);font-size:14px;justify-content:center}

.carte-ciel{margin-block:20px 8px;border:1px solid var(--trait);border-radius:var(--r);background:rgba(10,12,19,.55);overflow:hidden}
.carte-ciel svg{display:block;width:100%;height:auto}
.carte-ciel .legende{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--trait);font-family:var(--f-label);font-size:13px}
.lettres{display:flex;gap:6px;flex-wrap:wrap}
.lettres span{width:26px;height:32px;display:grid;place-items:center;border:1px solid var(--trait);border-radius:6px;font-family:var(--f-titre);color:var(--sourdine)}
.lettres span.ok{border-color:var(--or);color:var(--or-vif);background:rgba(201,164,90,.1)}
svg .etoile-c{cursor:pointer}
svg .etoile-c:hover circle.coeur{fill:var(--or-vif)}

.bloc{display:grid;gap:14px;margin-top:40px}
.bloc>header{display:grid;gap:4px}
.bloc h2{font-size:30px}
.intro-carte{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px;border:1px solid var(--trait);border-radius:var(--r);background:var(--nuit-2)}
.intro-carte audio{width:100%}
.intro-carte .lune{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fff6dc, #c9a45a 60%, #6b5428);box-shadow:0 0 40px rgba(230,194,122,.35)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{cursor:pointer;text-align:left;padding:18px;border-radius:var(--r);border:1px solid var(--trait);background:var(--nuit-2);display:grid;gap:4px}
.mode h3{font-size:22px}
.mode p{margin:0;font-size:15px;color:var(--sourdine)}
.mode[aria-pressed="true"]{border-color:var(--or);background:linear-gradient(160deg, rgba(201,164,90,.16), var(--nuit-2))}
.mode[aria-pressed="true"] h3::after{content:"  ✓";color:var(--or-vif);font-size:18px}

.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vignette{position:relative;display:grid;text-decoration:none;color:inherit;border-radius:var(--r);overflow:hidden;border:1px solid var(--trait);background:var(--nuit-2);transition:transform .2s,border-color .2s}
.vignette:hover{transform:translateY(-3px);border-color:var(--or-doux)}
.vignette .vis{aspect-ratio:4/3;overflow:hidden;position:relative;background:var(--nuit-3)}
.vignette .vis img,.vignette .vis canvas{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block}
.vignette .txt{padding:12px 14px 14px;display:grid;gap:3px;min-width:0}
.vignette h3{font-size:19px;line-height:1.25}
.vignette .etat{position:absolute;top:10px;right:10px;font-family:var(--f-label);font-size:11px;background:rgba(10,12,19,.8);border:1px solid var(--trait);border-radius:999px;padding:3px 9px}
.vignette .etat.fini{border-color:var(--or);color:var(--or-vif)}
.mini-etoiles{font-size:13px;letter-spacing:2px;color:var(--or)}

/* ---- page conte ---- */
.conte{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:36px;align-items:start;margin-top:10px}
.conte .affiche{position:sticky;top:76px;display:grid;gap:12px}
.conte .affiche img,.conte .affiche canvas{width:100%;border-radius:var(--r);border:1px solid var(--trait);display:block;aspect-ratio:2/3;object-fit:cover}
.tete{display:grid;gap:8px;margin-bottom:18px}
.tete h1{font-size:clamp(34px,6vw,50px);line-height:1.1}
.tete .sous{font-family:var(--f-label);color:var(--sourdine);font-size:14px;letter-spacing:.06em}
.lecteur{display:grid;gap:8px;padding:14px 16px;border:1px solid var(--trait);border-radius:var(--r);background:var(--nuit-2);margin-bottom:22px}
.lecteur audio{width:100%}
.recit{max-width:65ch}
.recit p{margin:0 0 1em;text-indent:1.2em}
.recit p:first-child{text-indent:0}
.recit p:first-child::first-letter{font-family:var(--f-script);color:var(--or);font-size:3.4em;float:left;line-height:.9;padding:6px 10px 0 0}
.observer{border-top:1px solid var(--trait);padding-top:14px;margin-top:10px;font-family:var(--f-label);font-size:14px;color:var(--sourdine);max-width:65ch}
.observer .label{display:block;margin-bottom:4px}
.epreuves{display:grid;gap:10px;margin-block:30px 10px}
.epreuve{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--trait);border-radius:var(--r);background:var(--nuit-2)}
.epreuve .rond{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--or-doux);font-family:var(--f-label);font-size:14px;color:var(--or-vif)}
.epreuve.faite .rond{background:var(--or);color:var(--nuit);border-color:var(--or)}
.epreuve h3{font-size:19px}
.epreuve p{margin:0;font-size:14px;color:var(--sourdine);font-family:var(--f-label)}
.recompense{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);border:1px dashed var(--or-doux);font-family:var(--f-label);font-size:14px}
.recompense .grande-lettre{font-family:var(--f-titre);font-size:40px;color:var(--or-vif);width:56px;height:64px;display:grid;place-items:center;border:1px solid var(--or);border-radius:10px;background:rgba(201,164,90,.08);flex:none}
.nav-contes{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}

/* ---- scène des épreuves ---- */
.scene{position:fixed;inset:0;z-index:50;background:rgba(6,7,12,.94);backdrop-filter:blur(6px);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.scene .boite{max-width:640px;margin:0 auto;display:grid;gap:18px}
.scene .haut{display:flex;align-items:center;gap:12px}
.scene .haut h2{font-size:26px;flex:1;line-height:1.2}
.fermer{width:48px;height:48px;border-radius:50%;border:1px solid var(--trait);background:var(--nuit-2);cursor:pointer;font-size:20px;flex:none}
.consigne{margin:0;color:var(--texte);font-size:16px}
.msg{min-height:1.6em;font-family:var(--f-label);font-size:15px;text-align:center}
.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.compteur{font-family:var(--f-label);font-size:13px;color:var(--sourdine);font-variant-numeric:tabular-nums}

/* quiz */
.q{display:grid;gap:12px}
.q h3{font-size:22px;line-height:1.35}
.choix{display:grid;gap:10px}
.choix button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--trait);background:var(--nuit-2);cursor:pointer;font-family:var(--f-titre);font-size:17px}
.choix button:hover{border-color:var(--or-doux)}
.choix button.ok{border-color:var(--ok);background:rgba(143,199,160,.12)}
.choix button.ko{border-color:var(--ko);background:rgba(224,132,111,.1);opacity:.75}
.explic{font-size:15px;color:var(--sourdine);margin:0}
.points{display:flex;gap:6px}
.points i{width:28px;height:4px;border-radius:2px;background:var(--trait)}
.points i.f{background:var(--or)}

/* canevas / svg de jeu */
.toile{width:100%;max-width:560px;margin:0 auto;display:block;border-radius:var(--r);border:1px solid var(--trait);background:#05060b;touch-action:manipulation}
svg.toile text{font-family:var(--f-label)}

/* ordre */
.liste-ordre{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.liste-ordre li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--trait);background:var(--nuit-2);cursor:pointer;font-size:16px;line-height:1.35}
.liste-ordre li .n{font-family:var(--f-label);font-size:13px;color:var(--or)}
.liste-ordre li.sel{border-color:var(--or-vif);background:var(--nuit-3)}
.liste-ordre li.ok{border-color:var(--ok)}
.liste-ordre .fl{display:flex;gap:4px}
.liste-ordre .fl button{width:44px;height:44px;font-size:18px;border-radius:8px;border:1px solid var(--trait);background:var(--nuit);cursor:pointer}
.liste-ordre .contenu{display:flex;gap:10px;align-items:center;min-width:0}
.liste-ordre svg{flex:none}

/* memory */
.memo{display:grid;gap:8px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.carte-m{aspect-ratio:3/4;border-radius:10px;border:1px solid var(--trait);cursor:pointer;perspective:600px;background:none;padding:0}
.carte-m .in{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.carte-m.vue .in,.carte-m.trouvee .in{transform:rotateY(180deg)}
.carte-m .f,.carte-m .d{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:grid;place-items:center;padding:6px;text-align:center}
.carte-m .f{background:radial-gradient(circle at 50% 40%, var(--nuit-3), var(--nuit-2));color:var(--or);font-size:24px}
.carte-m .d{transform:rotateY(180deg);background:var(--nuit-3);font-size:clamp(12px,3.4vw,16px);line-height:1.2;color:var(--creme)}
.carte-m .d.nom{font-family:var(--f-titre);font-size:clamp(14px,3.8vw,19px);color:var(--or-vif)}
.carte-m.trouvee .d{background:rgba(201,164,90,.14);outline:1px solid var(--or)}

/* puzzle */
.puzzle{display:grid;width:100%;max-width:380px;margin:0 auto;aspect-ratio:2/3;gap:2px;border-radius:10px;overflow:hidden;background:var(--trait)}
.puzzle button{border:0;padding:0;cursor:pointer;background-repeat:no-repeat;outline-offset:-3px}
.puzzle button.sel{outline:3px solid var(--or-vif)}
.puzzle.fini{gap:0}
.modele{max-width:120px;border-radius:8px;border:1px solid var(--trait)}

/* cadenas */
.cadenas{display:flex;justify-content:center;gap:10px}
.chiffre{display:grid;gap:6px;justify-items:center}
.chiffre button{width:64px;height:52px;border-radius:10px;border:1px solid var(--trait);background:var(--nuit-2);cursor:pointer;font-size:18px}
.chiffre output{width:64px;height:80px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--or);background:var(--nuit-3);font-family:var(--f-titre);font-size:38px;color:var(--creme);font-variant-numeric:tabular-nums}
.secoue{animation:secoue .4s}
@keyframes secoue{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* énigme */
.devinette{font-family:var(--f-titre);font-style:italic;font-size:21px;line-height:1.5;color:var(--creme);border-left:2px solid var(--or);padding-left:16px;margin:0}
.saisie{display:flex;gap:8px;flex-wrap:wrap}
.saisie input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--nuit-2);color:var(--creme)}
.saisie input:focus{border-color:var(--or)}

/* pont des pies */
.ciel-pont{position:relative;height:340px;border-radius:var(--r);border:1px solid var(--trait);overflow:hidden;
  background:linear-gradient(180deg,#05060b,#0d1020 70%,#141832);touch-action:manipulation}
.ciel-pont .voie{position:absolute;left:-10%;right:-10%;top:30%;height:90px;transform:rotate(-8deg);
  background:radial-gradient(ellipse at center, rgba(243,234,212,.16), transparent 70%);pointer-events:none}
.pie{position:absolute;width:80px;height:56px;border:0;background:none;padding:0;cursor:pointer;will-change:transform}
.pie svg{width:100%;height:100%}
.pont{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px 12px;background:rgba(10,12,19,.75);border-top:1px solid var(--trait)}
.pont .astre{font-family:var(--f-label);font-size:12px;color:var(--or-vif);text-align:center;line-height:1.1}
.pont .astre::before{content:"✦";display:block;font-size:20px}
.pont .places{display:flex;gap:3px;flex:1;justify-content:center}
.pont .places i{width:30px;height:20px;border-bottom:2px dashed var(--trait)}
.pont .places i.p{border-bottom-color:var(--or)}
.pont .places i.p svg{width:30px;height:20px}

/* tambour */
.frappe{width:100%;padding:22px;border-radius:var(--r);font-size:20px;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.jauge{height:10px;border-radius:5px;background:var(--trait);overflow:hidden}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--ko));width:0}

/* résultat */
.resultat{text-align:center;display:grid;gap:12px;justify-items:center;padding:20px 0}
.resultat .etoiles-gagnees{font-size:44px;letter-spacing:8px;color:var(--or-vif)}
.resultat .etoiles-gagnees .v{color:var(--trait)}

/* finale */
.emplacements,.reserve{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.emplacements button,.reserve button{width:clamp(30px,8vw,46px);height:clamp(40px,10vw,56px);border-radius:8px;border:1px solid var(--trait);background:var(--nuit-2);cursor:pointer;font-family:var(--f-titre);font-size:clamp(20px,5vw,28px);color:var(--creme)}
.emplacements button{border-color:var(--or-doux);border-style:dashed}
.emplacements button.plein{border-style:solid;border-color:var(--or);color:var(--or-vif)}
.reserve button[disabled]{opacity:.15}
.diplome{border:1px solid var(--or);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center;
  background:radial-gradient(circle at 50% 0%, rgba(201,164,90,.18), var(--nuit-2) 70%)}
.diplome .mot{font-family:var(--f-titre);font-size:clamp(32px,8vw,54px);letter-spacing:.18em;color:var(--or-vif)}
.diplome .code{font-family:var(--f-label);font-size:22px;letter-spacing:.2em;color:var(--creme);border:1px dashed var(--or);border-radius:10px;padding:8px 16px}

/* ---- roue des contes : anneau au repos, tambour quand on la tourne ---- */
.roue{position:relative;height:min(78vh,680px);min-height:460px;border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 50%, rgba(80,60,120,.2), rgba(10,12,19,.65) 70%)}
.roue-scene{position:absolute;inset:0;cursor:grab;touch-action:none;outline:none}
.roue-scene:active{cursor:grabbing}
.roue-scene:focus-visible{outline:2px solid var(--or-vif);outline-offset:-4px;border-radius:var(--r)}
.roue-axe{position:absolute;top:50%;left:50%;transform-style:preserve-3d}
.roue-carte{position:absolute;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-decoration:none;color:inherit}
.roue-carte .face{position:relative;display:block;width:100%;height:100%;border-radius:10px;overflow:hidden;background:var(--nuit-3);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.9);outline:1px solid var(--trait)}
.roue-carte img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block;pointer-events:none}
.roue-carte .action{position:absolute;right:10px;bottom:10px;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;
  background:rgba(10,12,19,.8);color:var(--or-vif);border:1px solid var(--or-doux);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
@media (hover:hover){ .roue-carte:hover .action{opacity:1;transform:none} }
.roue-carte:focus-visible .action{opacity:1;transform:none}
.roue-carte .fait{position:absolute;left:10px;top:10px;font-family:var(--f-titre);font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  background:var(--or);color:var(--nuit)}
.roue-label{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-script);color:var(--or);text-align:center;line-height:1}
.roue-titre{position:absolute;top:50%;left:5%;width:25%;transform:translateY(-50%);pointer-events:none;opacity:0;display:grid;gap:8px}

  audio:"audio/01-sigui.mp3", img:"img/01.jpg", lettre:"O",
  texte:[
`Sur les hautes falaises de Bandiagara, quand le soleil se couche derrière les baobabs et que la roche rouge devient presque noire, les vieillards du pays dogon rassemblent les enfants du village autour d'un feu qui ne raconte jamais tout à fait la même histoire deux fois.`,
`Ce soir-là, c'est le vieux Amma qui parle, celui que l'on dit né sous une éclipse. Il pointe du doigt un endroit du ciel où rien, en apparence, ne brille. « Regardez bien, dit-il aux enfants serrés contre lui, là, juste à côté de Sigui Tolo, l'étoile la plus vive du ciel. Vous ne voyez rien ? C'est normal. Personne ne l'a jamais vue. Et pourtant elle est là, minuscule, plus lourde que toute la terre que vous foulez, et elle tourne, tourne, sans jamais se montrer. »`,
`Un enfant, sceptique, demande comment on peut croire à une étoile que personne n'a vue. Le vieil homme sourit, comme s'il attendait cette question depuis toujours. « Nos ancêtres l'ont apprise autrement que par les yeux, dit-il. Ils l'ont apprise par le silence, par l'écoute du ciel, par la patience de compter les saisons. Cinquante années, pas une de plus, pas une de moins : voilà le temps qu'il faut à cette étoile cachée pour accomplir un tour complet autour de sa sœur brillante. C'est pour cela que tous les cinquante ans, nous célébrons le grand Sigui, et que nous transmettons à votre génération ce que la nôtre a reçu de la précédente. »`,
`Bien des années plus tard, des hommes vinrent de l'autre côté des mers, avec des instruments de verre et de métal capables de voir plus loin que l'œil humain. Ils écoutèrent les Dogons parler de cette étoile invisible et compagne de Sirius, et ils rirent d'abord, poliment, comme on rit d'une légende. Puis ils pointèrent leurs télescopes vers le ciel, ajustèrent leurs lentilles, calculèrent leurs chiffres pendant de longues nuits — et ils trouvèrent l'étoile, exactement là où les Dogons l'avaient toujours dite : une naine si dense qu'une cuillère de sa matière aurait pesé plus qu'un village entier.`,
`Les savants repartirent troublés, incapables d'expliquer comment un peuple sans télescope avait pu connaître un secret que leurs propres instruments venaient à peine de percer. Le vieil Amma, quand on lui rapporta un jour cette histoire, ne parut pas surpris. « Ce qui est invisible, dit-il simplement, n'est pas forcément absent. Il suffit parfois d'écouter plus longtemps que les autres. »`],

{
  id:2, num:"II", region:"Sahel", titre:"Le chemin de lait", sous:"La Voie lactée chez les peuples peuls",
  audio:"audio/02-chemin-de-lait.mp3", img:"img/02.jpg", lettre:"M",
  texte:[
`Amadou avait douze ans la première fois qu'on le laissa garder seul le troupeau, une nuit entière, sous un ciel du Sahel si chargé d'étoiles qu'on aurait dit du sel renversé sur un tissu noir. Sa grand-mère, avant de rentrer sous la tente, s'était arrêtée un instant et avait levé le menton vers le ciel.`,
`« Tu vois cette longue traînée pâle, là-haut, qui traverse toute la voûte ? » lui demanda-t-elle. Amadou hocha la tête : il l'avait toujours vue, sans jamais y prêter attention. « On l'appelle le chemin de lait, dit-elle en s'asseyant près de lui. On raconte que c'est la route qu'empruntent les âmes de nos ancêtres pour rejoindre le monde d'en haut. Et l'on dit aussi qu'une nuit, il y a bien longtemps, les vaches du ciel, immenses et généreuses, ont renversé leur lait en traversant cette route à la hâte — et que la trace n'a jamais séché depuis. »`,
`Le garçon regarda longuement cette bande laiteuse, essayant d'imaginer des vaches assez grandes pour marcher sur le toit du monde. « Et les troupeaux qu'on entend au loin, la nuit, sans jamais les voir ? demanda-t-il. Ce sont eux aussi ? » Sa grand-mère sourit, satisfaite de la question. « Certains disent que des bergers invisibles mènent encore leurs bêtes le long de ce chemin, et que lorsqu'il brille avec une force particulière, c'est un signe : la saison des pluies sera généreuse. Regarde-le bien cette nuit. S'il est clair, dis-le-moi demain matin. »`,
`Amadou resta éveillé bien plus longtemps qu'à l'accoutumée, fixant la bande pâle jusqu'à ce que ses yeux piquent de fatigue. Il crut, à un moment, voir une ombre plus dense se déplacer le long du chemin — un troupeau céleste, peut-être, ou simplement le sommeil qui commençait à brouiller sa vue. Au matin, il rapporta fidèlement que le chemin avait brillé fort, toute la nuit, sans faiblir. Sa grand-mère hocha la tête, satisfaite, et partit préparer le mil en murmurant que l'année serait bonne.`,
`Ce n'est que bien plus tard, en menant à son tour ses propres bêtes sous d'autres cieux, qu'Amadou comprit ce que sa grand-mère avait voulu lui transmettre cette nuit-là : bien avant les cartes, les calendriers et les almanachs, ce fleuve d'étoiles avait déjà tout dit à qui savait le regarder — la direction à suivre, la saison à venir, et le chemin qu'emprunteraient un jour leurs propres âmes.`],
  observer:"La Voie lactée est mieux visible loin des lumières de la ville ; en intérieur, la projection immersive en recrée l'éclat pour la soirée.",
  epreuves:[
    {type:"quiz", titre:"As-tu bien écouté ?", questions:[
      {q:"Quel âge a Amadou la première nuit où il garde seul le troupeau ?", r:["12 ans","8 ans","16 ans"], e:"Il a douze ans."},
      {q:"D'après la légende, qui a renversé le lait dans le ciel ?", r:["Les vaches du ciel","Des chèvres affamées","Un berger maladroit"], e:"Les vaches du ciel, « immenses et généreuses », en traversant la route à la hâte."},
      {q:"Quand le chemin brille très fort, qu'annonce-t-il ?", r:["Une saison des pluies généreuse","Une tempête de sable","Un hiver très froid"], e:"Un chemin bien clair promet de bonnes pluies, et donc une bonne année."},
      {q:"Pour les Peuls, qui emprunte ce chemin pour rejoindre le monde d'en haut ?", r:["Les âmes des ancêtres","Les oiseaux migrateurs","Les caravanes de sel"], e:"C'est la route des âmes des ancêtres.", expert:true}]},
    {type:"ordre", titre:"La nuit d'Amadou", consigne:"Les souvenirs d'Amadou se sont mélangés. Remets la nuit dans l'ordre : touche deux lignes pour les échanger, ou utilise les flèches.", items:[
      "La grand-mère montre la longue traînée pâle dans le ciel",

      "La grand-mère part préparer le mil : l'année sera bonne",
      "Devenu berger, Amadou comprend enfin la leçon"]},
    {type:"enigme", titre:"La devinette du berger", question:"Je traverse tout le ciel sans jamais bouger. On dit que des vaches m'ont renversé, et les âmes des ancêtres marchent sur moi. Qui suis-je ?", reponses:["voie lactee","chemin de lait","chemin du lait","la voie lactee","le chemin de lait"], indice:"Les astronomes m'appellent aussi « Voie… »", solution:"La Voie lactée (le chemin de lait)."}

{
  id:3, num:"III", region:"Maghreb & Moyen-Orient", titre:"Les noms donnés aux étoiles", sous:"Les caravaniers du désert et l'astronomie arabe",
  audio:"audio/03-caravane.mp3", img:"img/03.jpg", lettre:"A",
  texte:[
`Le vieux Slimane guidait les caravanes depuis plus de quarante ans, et l'on disait de lui qu'il connaissait le désert mieux que sa propre maison. Cette nuit-là pourtant, une tempête de sable soudaine avait effacé toutes les traces, dispersé les repères, et laissé le jeune Yacine, son apprenti, complètement perdu au milieu des dunes, séparé du reste de la caravane.`,
`« Maître Slimane n'est plus là pour me guider, pensa-t-il, le cœur battant. Je vais mourir de soif avant l'aube. » Mais alors que le vent tombait enfin et que le ciel se dégageait, Yacine se souvint des paroles que Slimane répétait chaque soir en pointant du doigt les étoiles une à une, comme on récite une prière. « Celle-ci, disait-il, c'est Aldébaran, l'œil rouge du Taureau. Elle se lève toujours au même endroit, hiver comme été. Et celle-là, c'est Bételgeuse, l'épaule du grand chasseur. Si tu la gardes derrière ton épaule droite en marchant la nuit, tu iras vers l'oasis. »`,
`Yacine leva les yeux, chercha fébrilement dans le ciel immense, et finit par reconnaître la lueur rougeâtre qu'on lui avait apprise. Il plaça l'étoile derrière son épaule droite, exactement comme Slimane le lui avait enseigné mille fois sans qu'il y prête vraiment attention, et se mit à marcher, une dune après l'autre, jusqu'à ce que l'aube révèle enfin les palmiers de l'oasis, et avec eux, le reste de la caravane inquiète qui l'attendait.`,
`Quand il raconta son épreuve à Slimane, le vieil homme hocha la tête sans grande surprise. « Ce que je t'ai appris, dit-il, des savants l'ont écrit dans de grands livres il y a mille ans, à Bagdad et à Cordoue, quand ils dessinaient le ciel avec plus de précision que quiconque avant eux. Mais nous, les gens du désert, nous n'avions pas besoin de leurs livres : le ciel lui-même était notre carte, et nous n'avions qu'à apprendre à la lire. »`,
`Il désigna à nouveau les étoiles, une à une, comme il l'avait toujours fait. « Chacun de ces noms que tu as appris ce soir — Aldébaran, Bételgeuse, et tant d'autres — des voyageurs les prononcent encore aujourd'hui, bien après nous, dans des langues que ni toi ni moi ne parlerons jamais. Ils ne sauront peut-être jamais qu'un jeune homme perdu dans le désert leur doit la vie. Mais le ciel, lui, s'en souvient. »`],
  observer:"Cherchez Aldébaran, l'œil rougeoyant de la constellation du Taureau, visible en soirée à l'automne.",
  epreuves:[
    {type:"quiz", titre:"As-tu bien écouté ?", questions:[
      {q:"Comment s'appelle l'apprenti perdu dans les dunes ?", r:["Yacine","Slimane","Amadou"], e:"Yacine, l'apprenti du vieux guide Slimane."},
      {q:"Quelle étoile est « l'œil rouge du Taureau » ?", r:["Aldébaran","Bételgeuse","Sirius"], e:"Aldébaran, qui se lève toujours au même endroit."},
      {q:"Où Yacine doit-il garder Bételgeuse pour aller vers l'oasis ?", r:["Derrière son épaule droite","Droit devant lui","Au-dessus de sa tête"], e:"Derrière l'épaule droite, comme Slimane le lui avait appris mille fois."},
      {q:"Dans quelles villes les savants dessinaient-ils le ciel il y a mille ans ?", r:["Bagdad et Cordoue","Rome et Athènes","Tombouctou et Fès"], e:"Bagdad et Cordoue, grands foyers de l'astronomie arabe.", expert:true}]},
    {type:"memory", titre:"Le carnet de Slimane", consigne:"Beaucoup d'étoiles portent encore un nom arabe. Retourne les cartes et associe chaque étoile à ce que veut dire son nom.", paires:[
      ["Aldébaran","Celle qui suit (les Pléiades)"],["Bételgeuse","La main (ou l'épaule) du géant"],["Rigel","Le pied"],["Deneb","La queue (du Cygne)"],["Altaïr","L'aigle qui vole"],["Véga","L'aigle qui plonge"]]}
  ]
},
{
  id:4, num:"IV", region:"Grèce antique", titre:"Le chasseur et le scorpion", sous:"La légende d'Orion",
  audio:"audio/04-orion.mp3", img:"img/04.jpg", lettre:"S",
  texte:[
`On disait d'Orion, fils de Poséidon, qu'aucun gibier n'avait jamais échappé à sa lance, et qu'il pouvait marcher sur la mer sans même mouiller ses sandales. Une nuit, ivre de son succès, il se dressa devant ses compagnons de chasse, le torse couvert de trophées, et proclama d'une voix qui porta jusqu'aux nuages : « Il n'existe pas une bête sur cette terre que je ne puisse abattre. Pas une seule. Je les traquerai toutes, jusqu'à la dernière, dussé-je y consacrer ma vie entière. »`,
`Ce serment insensé parvint aux oreilles de Gaïa, la Terre elle-même, mère de toutes les créatures vivantes. Elle qui avait vu naître chaque bête, chaque insecte, chaque être rampant ou volant, ne put tolérer une telle menace contre ses enfants. « Tu te crois plus fort que la vie elle-même, murmura-t-elle dans l'obscurité de la nuit. Je vais t'apprendre l'humilité. »`,
`De la terre fendue surgit alors une créature minuscule, noire et luisante, armée d'un dard que nul antidote ne pouvait contrer : le premier scorpion. Pendant qu'Orion dormait, encore ivre de gloire, la petite bête grimpa silencieusement le long de sa cheville et le piqua. Le grand chasseur, qui n'avait jamais craint aucune bête à cornes ou à crocs, s'effondra en quelques instants, terrassé par un adversaire pas plus grand qu'un doigt.`,
`Les dieux de l'Olympe, témoins de cette chute, furent partagés entre l'admiration pour le chasseur et l'effroi devant son orgueil. Ils décidèrent de placer Orion parmi les étoiles, pour que son destin serve de leçon aux générations à venir — mais ils y placèrent aussi le scorpion, en un endroit précis du ciel : exactement à l'opposé du chasseur.`,
`Ainsi, encore aujourd'hui, quand le Scorpion se lève à l'horizon oriental, Orion, effrayé, disparaît aussitôt sous l'horizon occidental. Jamais, en aucune saison, les deux constellations ne se rencontrent dans le ciel. On raconte que le grand chasseur, malgré toute sa force, n'a toujours pas trouvé le courage d'affronter à nouveau celui qui l'a vaincu — et que leur duel silencieux se poursuit, nuit après nuit, depuis la nuit des temps.`],
  observer:"Orion et sa célèbre ceinture de trois étoiles se lèvent en fin de soirée à l'automne, à l'est.",
  epreuves:[
    {type:"quiz", titre:"As-tu bien écouté ?", questions:[
      {q:"De quel dieu Orion est-il le fils ?", r:["Poséidon","Zeus","Hadès"], e:"Fils de Poséidon, il pouvait marcher sur la mer."},
      {q:"Qui fait surgir le scorpion ?", r:["Gaïa, la Terre","Athéna","Les compagnons d'Orion"], e:"Gaïa, mère de toutes les créatures, veut lui apprendre l'humilité."},
      {q:"Pourquoi Orion et le Scorpion ne se croisent-ils jamais dans le ciel ?", r:["Ils sont placés à l'opposé l'un de l'autre","Le Scorpion dort la nuit","Orion se cache derrière la Lune"], e:"Quand le Scorpion se lève à l'est, Orion disparaît à l'ouest."},
      {q:"Combien d'étoiles forment la ceinture d'Orion ?", r:["3","2","5"], e:"Alnitak, Alnilam et Mintaka.", expert:true}]},
    {type:"constellation", titre:"Redessine le chasseur", consigne:"Les dieux ont placé Orion dans le ciel. Relie les étoiles deux par deux pour tracer sa silhouette : touche une étoile, puis celle à laquelle elle se rattache.",
      etoiles:[["Meïssa",50,12],["Bételgeuse",28,26],["Bellatrix",70,29],["Alnitak",42,56],["Alnilam",50,53],["Mintaka",58,50],["Saïph",34,86],["Rigel",73,83]],
      traits:[[0,1],[0,2],[1,3],[2,5],[3,4],[4,5],[3,6],[5,7]], fin:"Bételgeuse, l'épaule rouge, et Rigel, le pied bleu : tu as retrouvé Orion."}
  ]
},
{
  id:5, num:"V", region:"Chine", titre:"La tisserande et le bouvier", sous:"Véga, Altaïr et la Voie lactée",
  audio:"audio/05-tisserande.mp3", img:"img/05.jpg", lettre:"I",
  texte:[
`Zhinü était la plus habile tisserande du royaume céleste, fille de l'Empereur de Jade lui-même. Chaque jour, assise à son métier au-dessus des nuages, elle tissait les couleurs du couchant et les broderies de l'aurore. Lassée pourtant de cette existence parfaite mais solitaire, elle descendit un jour sur terre se baigner dans une rivière avec ses sœurs.`,
`C'est là que Niulang, un jeune bouvier pauvre mais au cœur pur, la vit pour la première fois et en tomba éperdument amoureux. Sur les conseils de son vieux buffle, qui parlait, dit-on, quand personne d'autre n'écoutait, il déroba les vêtements célestes de Zhinü pendant qu'elle se baignait, l'empêchant ainsi de remonter au ciel. Loin d'en vouloir au jeune homme, la tisserande, touchée par sa sincérité, accepta de rester avec lui et de devenir son épouse.`,
`Ils vécurent heureux plusieurs années, eurent deux enfants, et Zhinü, éprise de sa nouvelle vie terrestre, cessa peu à peu de tisser les nuages du ciel. Mais l'Impératrice du Ciel, sa mère, s'aperçut un jour que les couchers de soleil avaient perdu leurs couleurs et que les nuages, sans tisserande pour les façonner, flottaient tristement gris. Furieuse, elle descendit elle-même sur terre et ramena sa fille de force au royaume céleste, ignorant les larmes de Niulang qui tentait de la retenir.`,
`Le jeune bouvier, désespéré, chargea ses deux enfants dans des paniers suspendus à une palanche et se mit à courir vers le ciel pour rattraper son épouse. Alors qu'il n'était plus qu'à quelques pas d'elle, l'Impératrice, furieuse de cette poursuite, retira une épingle de ses cheveux et traça d'un geste un trait immense dans le ciel : un fleuve se forma aussitôt entre les deux amants, un fleuve d'étoiles que l'on nomme aujourd'hui la Voie lactée.`,
`Émue malgré elle par tant de chagrin, l'Impératrice consentit finalement à une chose : une fois par an, le septième jour du septième mois lunaire, les amants pourraient se retrouver. Ce jour-là, toutes les pies du monde s'envolent vers le ciel et forment de leurs ailes déployées un pont au-dessus du fleuve céleste, permettant à Zhinü et Niulang de se retrouver, le temps d'une seule nuit, avant de se séparer à nouveau pour une année entière. Depuis, Zhinü brille dans le ciel sous le nom de l'étoile Véga, et Niulang sous celui d'Altaïr.`],
  observer:"Véga et Altaïr, deux des étoiles les plus brillantes de l'été, séparées par la bande claire de la Voie lactée.",
  epreuves:[
    {type:"quiz", titre:"As-tu bien écouté ?", questions:[
      {q:"Quel est le talent de Zhinü ?", r:["Elle tisse les nuages et les couleurs du ciel","Elle chante pour les étoiles","Elle garde les buffles"], e:"Elle tisse les couleurs du couchant et les broderies de l'aurore."},
      {q:"Qui conseille le jeune bouvier Niulang ?", r:["Son vieux buffle, qui parle","Une pie","L'Empereur de Jade"], e:"Son vieux buffle, qui parlait quand personne d'autre n'écoutait."},
      {q:"Avec quoi l'Impératrice trace-t-elle le fleuve d'étoiles ?", r:["Une épingle de ses cheveux","Un pinceau","Son éventail"], e:"D'un geste avec son épingle, elle crée la Voie lactée."},
      {q:"Sous quel nom d'étoile brille Niulang ?", r:["Altaïr","Véga","Deneb"], e:"Niulang est Altaïr, Zhinü est Véga.", expert:true}]},
    {type:"pont", titre:"Le pont des pies", consigne:"C'est le septième jour du septième mois ! Attrape 7 pies en les touchant pour construire le pont entre Véga et Altaïr avant la fin du temps."},
    {type:"cadenas", titre:"La date des retrouvailles", consigne:"La porte du royaume céleste s'ouvre avec la date des retrouvailles : le jour, puis le mois.", code:"77", indice:"« Le septième jour du septième mois lunaire »."}
  ]
},
{
  id:6, num:"VI", region:"Australie", titre:"Les ombres du fleuve céleste", sous:"L'Émeu dans le ciel des peuples aborigènes",
  audio:"audio/06-emeu.mp3", img:"img/06.jpg", lettre:"T",
  texte:[
`Dans le désert rouge de l'Australie centrale, quand la nuit tombe et que le sable garde encore la chaleur du jour, les anciens rassemblent les plus jeunes et leur apprennent à regarder le ciel autrement que les étrangers venus d'ailleurs. « Ils cherchent des dessins faits de points brillants reliés entre eux, explique une grand-mère à sa petite-fille allongée près d'elle. Nous, nous cherchons aussi dans l'obscurité, entre les étoiles. »`,
`La petite fille plisse les yeux, cherchant à comprendre. « Regarde bien, là, le long de cette grande traînée pâle que les étrangers appellent la Voie lactée. Tu vois ces zones plus sombres, comme des trous dans la lumière ? » Après un long moment, l'enfant hoche la tête, émerveillée : les taches sombres, mises bout à bout, dessinent bel et bien une forme reconnaissable — une longue silhouette, un cou courbé, un corps allongé.`,
`« C'est l'Émeu céleste, dit la grand-mère. Sa tête, là, près de la Croix du Sud, ses ailes repliées, ses longues pattes qui s'étirent presque jusqu'à l'horizon. Il n'est pas toujours pareil : selon la saison, il se lève différemment, il se penche, il se recroqueville, tout comme un émeu vivant le ferait sur cette terre. » « Et à quoi ça sert de le connaître ? » demande la petite fille, pratique.`,
`« À bien plus qu'à s'émerveiller, répond la grand-mère avec un sourire. Quand l'Émeu céleste se couche d'une certaine façon, cela signifie que les émeus de la terre s'apprêtent à pondre leurs œufs. Nos ancêtres l'observaient chaque année pour savoir quand partir à leur recherche. Sur certains rochers sacrés, on peut encore voir des gravures très anciennes représentant cette forme, alignées avec une précision qui n'est pas due au hasard. »`,
`La petite fille reste silencieuse un long moment, fixant les vides entre les étoiles avec un regard neuf. « Alors le noir, dans le ciel, ce n'est pas juste rien ? » « Rien n'est jamais tout à fait rien, répond doucement la grand-mère. Chaque peuple regarde le même ciel avec les yeux que sa terre lui a donnés. Et parfois, ce sont les silences entre les étoiles qui ont le plus de choses à raconter. »`],
  observer:"La Croix du Sud n'est pas visible depuis l'hémisphère nord ; la projection immersive permettra d'en découvrir la silhouette et celle de l'Émeu céleste.",
  epreuves:[
    {type:"quiz", titre:"As-tu bien écouté ?", questions:[
      {q:"Où les anciens cherchent-ils des formes dans le ciel ?", r:["Dans les zones sombres, entre les étoiles","Seulement dans les étoiles les plus brillantes","Dans les nuages"], e:"« Nous cherchons aussi dans l'obscurité, entre les étoiles. »"},
      {q:"Près de quelle constellation se trouve la tête de l'Émeu ?", r:["La Croix du Sud","Orion","La Grande Ourse"], e:"Sa tête est près de la Croix du Sud."},
      {q:"Qu'annonce la position de l'Émeu céleste ?", r:["Le moment où les émeus pondent leurs œufs","L'arrivée des pluies","Une éclipse"], e:"Les ancêtres savaient ainsi quand partir chercher les œufs."},
      {q:"Peut-on voir la Croix du Sud depuis Besançon ?", r:["Non, seulement depuis l'hémisphère sud","Oui, chaque nuit d'été","Oui, au-dessus de l'étoile polaire"], e:"Elle reste sous notre horizon : c'est la projection qui la montre ce soir.", expert:true}]},
    {type:"puzzle", titre:"Les morceaux du ciel", consigne:"L'image de l'Émeu céleste s'est brisée. Touche deux morceaux pour les échanger, jusqu'à reconstituer l'affiche.", img:"img/06.jpg"}
  ]
},
{
  id:7, num:"VII", region:"Égypte ancienne", titre:"Le corps étoilé de Nout", sous:"La déesse du ciel qui avale le soleil chaque soir",
  audio:"audio/07-nout.mp3", img:null, art:"nout", lettre:"R",
  texte:[
`Au commencement du monde, disaient les prêtres de l'Égypte ancienne, Nout et Geb s'aimaient d'un amour si absolu qu'ils restaient enlacés jour et nuit, elle le ciel, lui la terre, sans jamais se séparer. Mais leur père, Shou, dieu de l'air, redoutait qu'un tel enlacement n'empêche à jamais le monde de respirer et de vivre entre eux. « Il faut que je vous sépare, dit-il un jour, le cœur lourd, sinon rien ne pourra jamais exister entre vous. »`,
`Il se glissa entre les deux amants et, de toute la force de ses bras, souleva Nout loin au-dessus de Geb, l'arquant comme un pont immense au-dessus de la terre, les mains posées à un horizon, les pieds à l'autre. Ainsi naquit le ciel tel qu'on le connaît, le corps de Nout constellé d'étoiles innombrables, veillant pour toujours sur son époux resté en contrebas, inconsolable.`,
`Chaque soir pourtant, Nout trouvait un moyen de retrouver, à sa façon, la compagnie qu'on lui avait arrachée : elle avalait le disque doré de Rê, le dieu-soleil, qui traversait alors tout son corps étoilé durant la nuit entière, affrontant dans l'obscurité les forces du chaos. Au petit matin, dans un ultime effort, Nout donnait naissance à Rê à l'horizon oriental, rougissant le ciel de la douleur et de la joie mêlées de cet accouchement quotidien.`,
`« Comment peux-tu avaler chaque soir celui qui donne vie au monde ? » lui demandaient parfois les autres divinités, troublées par ce cycle qui semblait cruel. « Je ne le dévore pas, répondait Nout. Je le porte. Et ce que l'on porte avec assez d'amour finit toujours par renaître. »`,
`Les étoiles elles-mêmes, disait-on, étaient les innombrables enfants de cette déesse du ciel. Certaines, proches du pôle et jamais englouties par l'horizon, furent choisies pour accueillir les âmes des pharaons défunts, seules dignes de régner éternellement aux côtés des dieux. Aujourd'hui encore, sur les plafonds de temples millénaires, on retrouve Nout peinte de tout son long, continuant inlassablement de veiller sur les vivants comme sur les morts.`],
  observer:"Les étoiles proches de l'horizon nord tournent sans jamais se coucher — ce sont elles que les Égyptiens considéraient comme éternelles.",
  epreuves:[
    {type:"quiz", titre:"As-tu bien écouté ?", questions:[
      {q:"Qui est Nout ?", r:["La déesse du ciel","La déesse du Nil","La déesse de la terre"], e:"Nout est le ciel ; son époux Geb est la terre."},
      {q:"Qui sépare Nout et Geb ?", r:["Shou, le dieu de l'air","Rê, le soleil","Les prêtres"], e:"Shou soulève Nout pour que le monde puisse respirer."},

let AC = null;
function son(type){
  if(!S.son) return;
  try{ if(navigator.vibrate){ const v = {ok:15, ko:[30,40,30], victoire:[20,60,20,60,50], boum:8}[type]; if(v) navigator.vibrate(v); } }catch(e){}
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const jouer = (f, d, dt=0, forme="sine", vol=.18) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = forme; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0, t+dt); g.gain.linearRampToValueAtTime(vol, t+dt+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dt+d);
      o.start(t+dt); o.stop(t+dt+d+.05);
    };
    if(type==="ok"){ jouer(880,.35); jouer(1320,.5,.08); }
    else if(type==="ko"){ jouer(180,.3,0,"triangle",.15); }
    else if(type==="victoire"){ [523,659,784,1047].forEach((f,i)=>jouer(f,.6,i*.12)); }
    else if(type==="tic"){ jouer(1200,.06,0,"sine",.06); }
    else if(type==="boum"){ jouer(90,.18,0,"square",.12); }
    else if(typeof type==="number"){ jouer(type,.25,0,"sine",.12); }
  }catch(e){}
}

/* lune en SVG selon la phase (0 = nouvelle, 4 = pleine) */
function svgLune(phase, taille=34){
  const r = 15, c = 17;
  const k = Math.cos(phase/8*2*Math.PI);           // 1 nouvelle, -1 pleine
  const croissante = phase <= 4;
  const rx = Math.abs(k)*r;
  // partie éclairée : demi-disque côté droit (croissante) ou gauche (décroissante) + ellipse terminatrice
  const cote = croissante ? 1 : 0;
  const balayage = (k > 0) === croissante ? 0 : 1;
  const d = phase===0 ? "" : phase===4 ? `M${c} ${c-r}A${r} ${r} 0 1 1 ${c} ${c+r}A${r} ${r} 0 1 1 ${c} ${c-r}Z`
    : `M${c} ${c-r}A${r} ${r} 0 0 ${cote} ${c} ${c+r}A${rx} ${r} 0 0 ${balayage} ${c} ${c-r}Z`;
  return `<svg width="${taille}" height="${taille}" viewBox="0 0 34 34" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="#20243a" stroke="rgba(243,234,212,.25)"/>${d?`<path d="${d}" fill="#f3ead4"/>`:""}</svg>`;
}

/* illustrations dessinées pour les contes sans affiche */
function dessinerArt(cv, type){
  const W = cv.width = 600, H = cv.height = 900, x = cv.getContext("2d");
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#05060c"); g.addColorStop(.7,"#11142a"); g.addColorStop(1,"#2a1d22");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  const rnd = graine(type==="nout"?7:11);
  for(let i=0;i<260;i++){ x.fillStyle=`rgba(243,234,212,${.15+rnd()*.6})`; x.beginPath(); x.arc(rnd()*W, rnd()*H*.8, rnd()*1.3+.2, 0, 7); x.fill(); }
  if(type==="nout"){
    // l'arche du corps de Nout, faite d'étoiles
    for(let i=0;i<900;i++){
      const a = Math.PI*(.04 + rnd()*.92), R = 230 + (rnd()-.5)*90*Math.sin(a);
      const px = W/2 + Math.cos(a)*R*1.15, py = 640 - Math.sin(a)*R*1.6;
      x.fillStyle = `rgba(230,194,122,${.25+rnd()*.7})`; x.beginPath(); x.arc(px,py,rnd()*1.8+.3,0,7); x.fill();
    }
    // le soleil qui se couche à l'ouest
    const s = x.createRadialGradient(70,640,4,70,640,90); s.addColorStop(0,"#ffe3a0"); s.addColorStop(.35,"#e6a24a"); s.addColorStop(1,"rgba(230,120,60,0)");
    x.fillStyle = s; x.beginPath(); x.arc(70,640,90,0,7); x.fill();
    // la terre (Geb)
    x.fillStyle="#0b0a0f"; x.beginPath(); x.moveTo(0,700); x.quadraticCurveTo(W/2,660,W,700); x.lineTo(W,H); x.lineTo(0,H); x.fill();
    // pyramides
    x.fillStyle="#17131a"; [[380,700,120],[500,705,80]].forEach(([px,py,s])=>{ x.beginPath(); x.moveTo(px-s,py); x.lineTo(px,py-s*.8); x.lineTo(px+s,py); x.fill(); });
  } else {
    // vingt-sept demeures en cercle autour de la lune
    const cx=W/2, cy=380;
    for(let i=0;i<27;i++){ const a=i/27*2*Math.PI - Math.PI/2; x.fillStyle = i===3 ? "#ffd98a" : "rgba(230,194,122,.75)";
      x.beginPath(); x.arc(cx+Math.cos(a)*230, cy+Math.sin(a)*230, i===3?5:3, 0, 7); x.fill(); }
    x.strokeStyle="rgba(201,164,90,.25)"; x.lineWidth=1; x.beginPath(); x.arc(cx,cy,230,0,7); x.stroke();
    const l = x.createRadialGradient(cx-40,cy-40,10,cx,cy,150); l.addColorStop(0,"#fff8e4"); l.addColorStop(.7,"#e9dcb8"); l.addColorStop(1,"#b9a77e");
    x.shadowColor="rgba(243,234,212,.5)"; x.shadowBlur=60; x.fillStyle=l; x.beginPath(); x.arc(cx,cy,140,0,7); x.fill(); x.shadowBlur=0;
    x.fillStyle="rgba(10,12,19,.88)"; x.beginPath(); x.arc(cx+90,cy-10,140,0,7); x.fill();
    x.fillStyle="#0b0a0f"; x.beginPath(); x.moveTo(0,760); x.quadraticCurveTo(W*.3,720,W*.55,750); x.quadraticCurveTo(W*.8,775,W,740); x.lineTo(W,H); x.lineTo(0,H); x.fill();
  }
  x.fillStyle="rgba(243,234,212,.9)"; x.font="italic 44px Lora, Georgia, serif"; x.textAlign="center";
  x.fillText(type==="nout"?"Nout":"Chandra", W/2, 830);
}

function montrerRoue(root){
  if(!root) return null;
  const CARTE_H = .38, CARTE_L_MAX = .34, CARTE_L_MAX_ETROIT = .62, RATIO = 1.45, PAS = 40, TAMBOUR = 2.22, OBJECTIF = 2.7,
        ANNEAU = 1.14, ARC = 1.82, TITRE = .124, CULL = 1.6, MOLETTE = 900, GLISSE = 420, POSE = 140, LISSAGE = .12;
  const scene = $(".roue-scene", root), axe = $(".roue-axe", root), cartes = [...root.querySelectorAll(".roue-carte")];
  const etiquette = $(".roue-label", root), bloc = $(".roue-titre", root), aide = $(".roue-aide", root);
  const index = [...root.querySelectorAll(".roue-index button")], liste = $(".roue-index", root);
  const n = cartes.length, dernier = n - 1, calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const borne = (v,a,b) => Math.min(b, Math.max(a, v)), rad = d => d*Math.PI/180;
  let tour = 0, cible = 0, actif = -1, cadre = 0, M = null, pose = 0;

  const mesurer = () => {
    const w = scene.clientWidth, h = scene.clientHeight; if(!h) return;
    const etroit = w < 640;
    root.classList.toggle("etroit", etroit);
    $("#roue-aide-t", root).textContent = etroit ? "Glisse de haut en bas ou de gauche à droite pour tourner la roue" : "Molette, glisser ou flèches pour tourner la roue";
    const cw = Math.min(h*CARTE_H*RATIO, w*(etroit?CARTE_L_MAX_ETROIT:CARTE_L_MAX)), ch = cw/RATIO;
    const rAnneau = etroit ? Math.min(w*.36, h*.34) : ch*ANNEAU;
    M = { cw, ch, rAnneau, rTambour: ch*TAMBOUR, arc: ch*ARC, echelle: borne(((2*Math.PI*rAnneau/n)*.82)/cw, .16, 1) };
    scene.style.perspective = ch*OBJECTIF + "px";
    cartes.forEach(c => { c.style.width = cw+"px"; c.style.height = ch+"px"; c.style.marginLeft = -cw/2+"px"; c.style.marginTop = -ch/2+"px"; });
    etiquette.style.fontSize = Math.max(30, ch*TITRE*1.9) + "px";
    $(".t", bloc).style.fontSize = Math.max(20, ch*TITRE*1.05) + "px";
    dessiner();
  };
  const placer = (degAnneau, degTambour, m) =>
    `translateX(${m * -M.arc * (1 - Math.cos(rad(degTambour)))}px) rotateZ(${(1-m)*degAnneau}deg) translateY(${-(1-m)*M.rAnneau}px) rotateX(${m*degTambour}deg) translateZ(${m*M.rTambour}px)`;
  const dessiner = () => {
    if(!M) return;
    const m = borne(tour, 0, 1), pos = Math.max(0, tour - 1);
    axe.style.transform = `translateZ(${-m*M.rTambour}px)`;
    for(let i=0;i<n;i++){
      const d = i - pos, c = cartes[i], cache = m > .5 && Math.abs(d) > CULL;
      c.style.transform = placer(d*(360/n), d*PAS, m);
      c.style.opacity = cache ? "0" : "1";
      c.style.pointerEvents = cache ? "none" : "";
      c.style.zIndex = String(Math.round(100 - Math.abs(d)*2));
      c.firstElementChild.style.transform = `scale(${M.echelle + (1-M.echelle)*m})`;
    }
    etiquette.style.opacity = String(1 - m); aide.style.opacity = String(1 - m); bloc.style.opacity = String(m);
    liste.style.opacity = String(m); liste.style.pointerEvents = m > .5 ? "auto" : "none";
    const proche = borne(Math.round(pos), 0, dernier);
    if(proche !== actif){
      actif = proche; const c = CONTES[actif];
      $("#roue-k", root).textContent = `Conte ${c.num} · ${c.region}`; $("#roue-t", root).textContent = c.titre;
      index.forEach((b,i) => b.classList.toggle("actif", i === actif));
    }
  };
  const boucle = () => {
    cadre = 0;
    const ecart = cible - tour;
    tour = Math.abs(ecart) < .0005 ? cible : tour + ecart*(calme ? 1 : LISSAGE);
    dessiner();
    if(tour !== cible) cadre = requestAnimationFrame(boucle);
  };
  const vers = v => { cible = borne(v, 0, dernier + 1); if(!cadre) cadre = requestAnimationFrame(boucle); };
  const poser = () => { clearTimeout(pose); pose = setTimeout(() => vers(cible > .5 ? Math.max(1, Math.round(cible)) : 0), POSE); };

  // La molette ne tourne la roue que si elle est entièrement à l'écran, et rend la main
  // à la page une fois arrivée au bout, pour ne jamais piéger la lecture.
  const molette = ev => {
    const r = root.getBoundingClientRect();
    if(r.top < -30 || r.bottom > innerHeight + 30) return;
    const v = cible + ev.deltaY / MOLETTE;
    if(v > 0 && v < dernier + 1){ ev.preventDefault(); vers(v); poser(); }
    else vers(v);
  };
  scene.addEventListener("wheel", molette, {passive:false});

  // Au doigt comme à la souris, la roue tourne dans les deux sens : de haut en bas ou de
  // gauche à droite. Arrivée au bout, un glissement vertical fait défiler la page,
  // pour qu'on ne reste jamais coincé dans la roue.
  let depart = null, bouge = 0;
  scene.addEventListener("pointerdown", ev => { depart = {x:ev.clientX, y:ev.clientY, type:ev.pointerType, axe:null}; bouge = 0; });
  scene.addEventListener("pointermove", ev => {
    if(!depart) return;
    const dx = depart.x - ev.clientX, dy = depart.y - ev.clientY;
    if(!depart.axe){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      depart.axe = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      try{ scene.setPointerCapture(ev.pointerId); }catch(e){}
    }
    const delta = depart.axe === "x" ? dx : dy;
    bouge += Math.abs(delta);
    const v = cible + delta / (depart.type === "mouse" ? GLISSE : GLISSE*.6);
    if(depart.axe === "y" && ((v <= 0 && delta < 0) || (v >= dernier + 1 && delta > 0))) window.scrollBy(0, delta);
    else vers(v);
    depart.x = ev.clientX; depart.y = ev.clientY;
  });
  const lacher = () => { if(depart && bouge > 6) poser(); depart = null; };
  scene.addEventListener("pointerup", lacher); scene.addEventListener("pointercancel", lacher);
  scene.addEventListener("keydown", ev => {
    if(ev.key === "ArrowDown" || ev.key === "ArrowRight") vers(Math.round(cible) + 1);
    else if(ev.key === "ArrowUp" || ev.key === "ArrowLeft") vers(Math.round(cible) - 1);
    else return;
    ev.preventDefault();
  });
  // Un clic sur une affiche qui n'est pas de face la fait venir devant ; de face, il ouvre le conte.
  cartes.forEach((c,i) => c.addEventListener("click", ev => {
    if(bouge > 6){ ev.preventDefault(); return; }
    if(!(tour > .98 && Math.round(tour - 1) === i)){ ev.preventDefault(); vers(i + 1); }
  }));
  index.forEach((b,i) => b.onclick = () => vers(i + 1));
  root.querySelectorAll(".roue-nav button").forEach(b => b.onclick = () => vers(Math.round(cible) + +b.dataset.d));

  const ro = new ResizeObserver(mesurer); ro.observe(scene); mesurer();
  return () => { cancelAnimationFrame(cadre); clearTimeout(pose); ro.disconnect(); scene.removeEventListener("wheel", molette); };
}

/* ---------------------------------------------------------------------
   LE VOYAGE : frise épinglée qui glisse de côté au défilement.
   Sans GSAP (hors ligne) ou avec « réduire les animations », elle reste
   une frise lisible qu'on fait défiler à la main.
   --------------------------------------------------------------------- */
function montrerVoyage(sec){
  if(!sec) return null;
  if(matchMedia("(max-width: 760px), (pointer: coarse)").matches || !window.gsap || !window.ScrollTrigger) return voyageAuDoigt(sec);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
  gsap.registerPlugin(ScrollTrigger);
  sec.classList.add("anime");
  const aideV = $(".voyage-aide", sec);
  $(".voyage-aide-t", sec).textContent = "Continue de défiler vers le bas : le voyage avance";
  aideV.querySelector(".geste").className = "geste bas";
  const piste = $(".voyage-piste", sec), panneau = $(".voyage-panneau", sec);
  const distance = () => Math.max(0, piste.scrollWidth - panneau.clientWidth);
  const glisse = gsap.to(piste, { x: () => -distance(), ease: "none",
    scrollTrigger: { trigger: sec, start: "top top", end: () => "+=" + distance(), pin: true, scrub: .6, invalidateOnRefresh: true, anticipatePin: 1 } });
  const fil = gsap.fromTo($(".voyage-fil i", sec), {scaleX: 0}, { scaleX: 1, ease: "none",
    scrollTrigger: { trigger: sec, start: "top top", end: () => "+=" + distance(), scrub: .6, invalidateOnRefresh: true,
      onUpdate: st => aideV.classList.toggle("cache", st.progress > .04) } });
  const etapes = [...sec.querySelectorAll(".etape")].map(et => gsap.timeline({
      scrollTrigger: { trigger: et, containerAnimation: glisse, start: "left 88%", end: "left 58%", scrub: true } })
    .fromTo($(".tige", et), {scaleY: 0}, {scaleY: 1, duration: .4, ease: "none"})
    .fromTo($(".point", et), {scale: 0}, {scale: 1, duration: .4, ease: "back.out(2)"}, "<")
    .fromTo(et.querySelectorAll(".ligne"), {yPercent: 110}, {yPercent: 0, duration: 1, stagger: .1, ease: "power2.out"}, "-=.15"));
  const rafraichir = () => ScrollTrigger.refresh();
  const img = $(".voyage-image img", sec); if(img && !img.complete) img.addEventListener("load", rafraichir, {once:true});
  if(document.fonts) document.fonts.ready.then(rafraichir);
  return () => {
    etapes.forEach(t => { t.scrollTrigger && t.scrollTrigger.kill(); t.kill(); });
    fil.scrollTrigger.kill(); fil.kill(); glisse.scrollTrigger.kill(true); glisse.kill();
  };
}

/* Téléphone et tablette : la frise se glisse au doigt, la page continue de défiler normalement. */
function voyageAuDoigt(sec){
  sec.classList.add("glisse");
  const panneau = $(".voyage-panneau", sec), aide = $(".voyage-aide", sec), barre = $(".voyage-progres i", sec);
  const [prec, suiv] = sec.querySelectorAll(".voyage-fleche");
  const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fil = $(".voyage-fil i", sec);
  const maj = () => {
    const max = panneau.scrollWidth - panneau.clientWidth, p = max > 0 ? panneau.scrollLeft / max : 0;
    barre.style.transform = `scaleX(${p})`; fil.style.transform = `scaleX(${p})`;
    prec.disabled = panneau.scrollLeft < 8; suiv.disabled = panneau.scrollLeft > max - 8;
    if(panneau.scrollLeft > 30) aide.classList.add("cache");
  };
  panneau.addEventListener("scroll", maj, {passive:true});
  sec.querySelectorAll(".voyage-fleche").forEach(b => b.onclick = () =>
    panneau.scrollBy({left: +b.dataset.sens * panneau.clientWidth * .8, behavior: calme ? "auto" : "smooth"}));
  let io = null;
  if(calme || !("IntersectionObserver" in window)) sec.querySelectorAll(".etape").forEach(e => e.classList.add("vue"));
  else {
    io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("vue"); io.unobserve(e.target); } }), {root: panneau, threshold: .3});
    sec.querySelectorAll(".etape").forEach(e => io.observe(e));
  }
  maj();
  return () => { io && io.disconnect(); panneau.removeEventListener("scroll", maj); };
}

   SCÈNE DES ÉPREUVES
   ===================================================================== */
const SCENE = $("#scene"), BOITE = $("#scene-boite");
let nettoyage = null;
let sceneHist = false;
function fermerScene(){ if(nettoyage){ nettoyage(); nettoyage = null; } SCENE.hidden = true; document.body.style.overflow = ""; sceneHist = false; }
// Le bouton « retour » du téléphone ferme le jeu au lieu de quitter la page
function quitterScene(){ if(sceneHist) history.back(); else { fermerScene(); route(); } }
addEventListener("popstate", () => { if(!SCENE.hidden){ fermerScene(); route(); } });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !SCENE.hidden) quitterScene(); });

function ouvrirEpreuve(c, i){
  const e = c.epreuves[i];
  SCENE.hidden = false; document.body.style.overflow = "hidden"; SCENE.scrollTop = 0;
  if(!sceneHist){ try{ history.pushState({scene:true}, ""); sceneHist = true; }catch(e){} }
  BOITE.innerHTML = `
    <div class="haut"><div style="flex:1;min-width:0"><div class="label">Conte ${c.num} · défi ${i+1} / ${c.epreuves.length}</div><h2 id="scene-titre">${esc(e.titre)}</h2></div>
      <button class="fermer" type="button" aria-label="Fermer">×</button></div>
    ${e.consigne?`<p class="consigne">${esc(e.consigne)}</p>`:""}
    <div id="jeu"></div>`;
  $(".fermer", BOITE).onclick = quitterScene;
  const fini = err => {
    if(nettoyage){ nettoyage(); nettoyage = null; }
    const n = noteDe(err), avant = conteFini(c);
    S.res[cleE(c,i)] = Math.max(etoilesDe(c,i), n); sauver();
    const lettre = !avant && conteFini(c);
    son("victoire");
    const suivante = c.epreuves.findIndex((_,k)=> etoilesDe(c,k)===0);
    $("#jeu", BOITE).innerHTML = `<div class="resultat">
      <div class="label">Défi réussi</div>
      <div class="etoiles-gagnees" aria-label="${n} étoiles sur 3">${"★".repeat(n)}<span class="v">${"★".repeat(3-n)}</span></div>
      <p style="margin:0">${n===3?"Parfait, sans une seule erreur !":n===2?"Très bien joué !":"Réussi ! Rejoue plus tard pour gagner plus d'étoiles."}</p>
      ${e.fin?`<p class="explic">${esc(e.fin)}</p>`:""}
      ${lettre?`<div class="recompense" style="margin-top:6px"><span class="grande-lettre">${c.lettre}</span><span>Conte terminé ! Tu gagnes la lettre <b style="color:var(--or-vif)">${c.lettre}</b>.</span></div>`:""}
      <div class="rangee" style="justify-content:center;margin-top:8px">
        ${suivante>=0?`<button class="btn" type="button" id="b-suite">Défi suivant</button>`:""}
        <button class="btn ${suivante>=0?"fantome":""}" type="button" id="b-retour">${suivante>=0?"Revenir au conte":"Voir le conte"}</button>
        ${lettre?`<a class="btn fantome" href="#${premierAFaire()}" id="b-autre">${toutFini()?"Énigme finale":"Conte suivant"}</a>`:""}
      </div></div>`;
    const bs = $("#b-suite", BOITE); if(bs) bs.onclick = () => ouvrirEpreuve(c, suivante);
    $("#b-retour", BOITE).onclick = quitterScene;
    SCENE.scrollTop = 0;
    const ba = $("#b-autre", BOITE); if(ba) ba.onclick = () => fermerScene();
  };
  JEUX[e.type]($("#jeu", BOITE), e, fini);
  $(".fermer", BOITE).focus({preventScroll:true});
}

JEUX.quiz = (el, e, fini) => {
  const qs = e.questions.filter(q => !q.expert || expert());
  let k = 0, err = 0;
  const poser = () => {
    const q = qs[k], opts = melanger(q.r.map((t,j)=>({t, bon:j===0})));

      <div class="points">${qs.map((_,j)=>`<i class="${j<k?"f":""}"></i>`).join("")}</div>

      <div class="rangee" id="suite"></div></div>`;
    el.querySelectorAll(".choix button").forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.j];
      if(b.classList.contains("ko") || el.querySelector(".choix .ok")) return;

        $("#suite button", el).focus({preventScroll:true});
        $("#suite", el).scrollIntoView({block:"nearest", behavior:"smooth"});
      } else { b.classList.add("ko"); err++; son("ko"); $("#explic", el).textContent = "Pas tout à fait… essaie une autre réponse."; }

};

JEUX.invisible = (el, e, fini) => {
  el.innerHTML = `<canvas class="toile" id="cv" aria-label="Ciel autour de Sirius : touche pour chercher l'étoile cachée"></canvas>
    <div class="msg" id="msg">Touche le ciel près de Sirius…</div><div class="compteur" style="text-align:center" id="nb"></div>`;
  const cv = $("#cv", el), x = cv.getContext("2d");
  const N = 560; cv.width = N; cv.height = N;
  const rnd = graine(42), fond = Array.from({length:180}, () => [rnd()*N, rnd()*N, rnd()*1.2+.2, rnd()*.6+.2]);
  const SX = .5, SY = .46, a = Math.random()*Math.PI*2, d0 = .14 + Math.random()*.14;
  const T = {x: Math.min(.9,Math.max(.1, SX + Math.cos(a)*d0)), y: Math.min(.9,Math.max(.1, SY + Math.sin(a)*d0))};
  const seuil = expert() ? .045 : .07;
  const traces = []; let essais = 0, trouve = false;
  const dessiner = () => {
    x.fillStyle = "#05060b"; x.fillRect(0,0,N,N);
    fond.forEach(([px,py,r,o]) => { x.fillStyle=`rgba(243,234,212,${o})`; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); });
    const g = x.createRadialGradient(SX*N,SY*N,0,SX*N,SY*N,60); g.addColorStop(0,"#ffffff"); g.addColorStop(.12,"#cfe3ff"); g.addColorStop(1,"rgba(150,190,255,0)");
    x.fillStyle = g; x.beginPath(); x.arc(SX*N,SY*N,60,0,7); x.fill();
    x.fillStyle="rgba(243,234,212,.7)"; x.font="15px Poppins, sans-serif"; x.textAlign="center"; x.fillText("Sigui Tolo · Sirius", SX*N, SY*N+48);
    traces.forEach(t => { x.strokeStyle = t.c; x.lineWidth = 2; x.globalAlpha = t.o; x.beginPath(); x.arc(t.x*N, t.y*N, 16, 0, 7); x.stroke(); x.globalAlpha = 1; });
    if(trouve){ const h = x.createRadialGradient(T.x*N,T.y*N,0,T.x*N,T.y*N,26); h.addColorStop(0,"#ffffff"); h.addColorStop(.3,"#e6c27a"); h.addColorStop(1,"rgba(230,194,122,0)");
      x.fillStyle=h; x.beginPath(); x.arc(T.x*N,T.y*N,26,0,7); x.fill(); x.fillStyle="#e6c27a"; x.fillText("Sirius B", T.x*N, T.y*N-30); }
  };
  dessiner();
  cv.addEventListener("pointerdown", ev => {
    if(trouve) return;
    const r = cv.getBoundingClientRect(), px = (ev.clientX-r.left)/r.width, py = (ev.clientY-r.top)/r.height;
    const d = Math.hypot(px-T.x, py-T.y); essais++;
    traces.forEach(t => t.o *= .7);
    let txt, col;
    if(d < seuil){ trouve = true; txt = "Trouvée ! Ce qui est invisible n'est pas forcément absent."; col = "#e6c27a"; }
    else if(d < .1){ txt = "Brûlant !"; col = "#ff9a6b"; }
    else if(d < .17){ txt = "Très chaud"; col = "#f0b56a"; }
    else if(d < .27){ txt = "Tiède…"; col = "#c9b98a"; }
    else { txt = "Froid, très loin"; col = "#7fa6d6"; }
    traces.push({x:px, y:py, c:col, o:1});
    son(trouve ? "ok" : Math.round(220 + Math.max(0, 1 - d/.6)*900));
    const m = $("#msg", el); m.textContent = txt; m.className = "msg" + (trouve?" ok":"");
    $("#nb", el).textContent = essais + " essai" + (essais>1?"s":"");
    dessiner();
    if(trouve) setTimeout(() => fini(Math.max(0, Math.floor((essais-2)/3))), 1600);
  });
};
