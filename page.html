      return `<line x1="${A[1]}" y1="${A[2]}" x2="${B[1]}" y2="${B[2]}" stroke="#c9a45a" stroke-width=".7" stroke-linecap="round"/>`; }).join("");
    $("#g-etoiles", sv).innerHTML = e.etoiles.map(([nom,x,y],i)=>{ const lie = [...faits].some(k=>k.split("-").includes(String(i)));
      return `<g data-i="${i}" style="cursor:pointer" role="button" aria-label="${esc(nom)}" tabindex="0">
        <circle cx="${x}" cy="${y}" r="${zone[i].toFixed(2)}" fill="transparent"/>
        ${i===sel?`<circle cx="${x}" cy="${y}" r="3.4" fill="none" stroke="#e6c27a" stroke-width=".5"/>`:""}
        <circle cx="${x}" cy="${y}" r="${lie||i===sel?1.9:1.5}" fill="${lie||i===sel?"#e6c27a":"#f3ead4"}"/>
        ${guide||lie?`<text x="${x}" y="${y+5.2}" text-anchor="middle" font-size="3" fill="${lie?"#e6c27a":"#9a8f74"}">${esc(nom)}</text>`:""}</g>`; }).join("");
    sv.querySelectorAll("[data-i]").forEach(g => { g.onclick = () => clic(+g.dataset.i); g.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); clic(+g.dataset.i); } }; });
  };
  const clic = i => {
    if(sel < 0 || sel === i){ sel = sel===i ? -1 : i; son("tic"); rendu(); return; }
    const k = cle(sel, i), m = $("#msg", el);
    if(attendus.has(k) && !faits.has(k)){ faits.add(k); son("ok"); m.className="msg ok"; m.textContent = `${e.etoiles[sel][0]} — ${e.etoiles[i][0]}`; sel = i; }
    else if(faits.has(k)){ sel = i; m.className="msg"; m.textContent="Ce trait est déjà tracé."; }
    else { err++; son("ko"); m.className="msg ko"; m.textContent = "Ces deux étoiles ne sont pas reliées dans cette constellation."; sel = -1; }
    $("#nb", el).textContent = `${faits.size} trait${faits.size>1?"s":""} sur ${e.traits.length}`;
    rendu();
    if(faits.size === attendus.size){ sel=-1; rendu(); setTimeout(()=>fini(err), 1100); }
  };
  rendu();
};

JEUX.puzzle = (el, e, fini) => {
  const n = expert() ? 4 : 3, N = n*n;
  let p; do { p = melanger([...Array(N).keys()]); } while(p.every((v,i)=>v===i));
  let sel = -1, coups = 0;
  el.innerHTML = `<div class="puzzle" id="pz" style="grid-template-columns:repeat(${n},1fr)"></div>
    <div class="rangee" style="justify-content:space-between"><span class="compteur" id="nb">0 échange</span>
      <details><summary class="compteur" style="cursor:pointer">Voir le modèle</summary><img class="modele" src="${e.img}" alt="Modèle de l'affiche"></details></div>
    <div class="msg" id="msg"></div>`;
  const pz = $("#pz", el);
  const rendu = () => {
    pz.innerHTML = p.map((v,k)=>{ const cx = v % n, cy = Math.floor(v / n);
      return `<button type="button" data-k="${k}" class="${k===sel?"sel":""}" aria-label="Morceau ${k+1}"
        style="background-image:url('${e.img}');background-size:${n*100}% ${n*100}%;background-position:${cx/(n-1)*100}% ${cy/(n-1)*100}%"></button>`; }).join("");
    pz.querySelectorAll("button").forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if(sel < 0){ sel = k; son("tic"); }
      else if(sel === k){ sel = -1; }
      else { [p[k],p[sel]] = [p[sel],p[k]]; sel = -1; coups++; son("tic");
        $("#nb", el).textContent = coups + " échange" + (coups>1?"s":"");
        if(p.every((v,i)=>v===i)){ rendu(); pz.classList.add("fini"); son("ok"); $("#msg", el).className="msg ok"; $("#msg", el).textContent="L'Émeu céleste est réapparu !";
          const lim = N - 1; setTimeout(()=>fini(coups <= lim+2 ? 0 : coups <= lim*2 ? 1 : 3), 1200); return; } }
      rendu();
    });
  };
  rendu();
};

JEUX.pont = (el, e, fini) => {
  const BESOIN = 7, DUREE = expert() ? 30 : 42, TRAJET = expert() ? 2600 : 3800, RYTHME = expert() ? 800 : 900;
  const PIE = `<svg viewBox="0 0 64 44" aria-hidden="true"><path d="M4 22 Q18 4 32 18 Q46 4 60 22 Q46 14 34 26 L30 26 Q18 14 4 22Z" fill="#f3ead4"/><ellipse cx="32" cy="27" rx="7" ry="5" fill="#1b1f31" stroke="#f3ead4" stroke-width="1.5"/><path d="M38 28 L50 34 L38 31Z" fill="#1b1f31" stroke="#f3ead4"/></svg>`;
  let err = 0, timers = [], raf = 0;
  const partie = () => {
    let pris = 0, reste = DUREE, oiseaux = [], fin = false;
    el.innerHTML = `<div class="rangee" style="justify-content:space-between"><span class="compteur" id="tps">${DUREE} s</span><span class="compteur" id="nb">0 / ${BESOIN} pies</span></div>
      <div class="ciel-pont" id="cp"><div class="voie"></div>
        <div class="pont"><span class="astre">Véga</span><span class="places">${"<i></i>".repeat(BESOIN)}</span><span class="astre">Altaïr</span></div></div>
      <div class="msg" id="msg"></div>`;
    const cp = $("#cp", el);
    const lancer = () => {
      if(fin) return;
      const b = document.createElement("button"); b.type="button"; b.className="pie"; b.innerHTML = PIE; b.setAttribute("aria-label","Attraper la pie");
      const sens = Math.random()<.5 ? 1 : -1, haut = 8 + Math.random()*58;
      const o = {b, t0: performance.now(), sens, haut, duree: TRAJET*(.85+Math.random()*.3)};
      b.style.top = haut + "%"; if(sens<0) b.querySelector("svg").style.transform = "scaleX(-1)";
      b.onpointerdown = ev => { ev.preventDefault(); if(fin) return; b.remove(); oiseaux = oiseaux.filter(x=>x!==o);
        pris++; son(500 + pris*90);
        const pl = cp.querySelectorAll(".places i")[pris-1]; if(pl){ pl.classList.add("p"); pl.innerHTML = PIE; }
        $("#nb", el).textContent = `${pris} / ${BESOIN} pies`;
        if(pris >= BESOIN) gagner(); };
      cp.appendChild(b); oiseaux.push(o);
    };
    const boucle = now => {
      const W = cp.clientWidth;
      oiseaux.forEach(o => { const k = (now - o.t0) / o.duree, xx = o.sens>0 ? -70 + k*(W+140) : W + 70 - k*(W+140);
        o.b.style.transform = `translate(${xx}px, ${Math.sin(k*12)*8}px)`; if(k>1){ o.b.remove(); o.mort = true; } });
      oiseaux = oiseaux.filter(o=>!o.mort);
      if(!fin) raf = requestAnimationFrame(boucle);
    };
    const arreter = () => { fin = true; timers.forEach(clearInterval); timers = []; cancelAnimationFrame(raf); };
    const gagner = () => { arreter(); oiseaux.forEach(o=>o.b.remove()); son("ok"); const m=$("#msg", el); m.className="msg ok"; m.textContent="Le pont est construit : Zhinü et Niulang se retrouvent !"; setTimeout(()=>fini(err), 1500); };
    timers.push(setInterval(lancer, RYTHME));
    timers.push(setInterval(() => { reste--; $("#tps", el).textContent = reste + " s";
      if(reste <= 0 && !fin){ arreter(); err += 2; son("ko"); oiseaux.forEach(o=>o.b.remove());
        const m=$("#msg", el); m.className="msg ko"; m.innerHTML = `Le temps est écoulé, il manque ${BESOIN-pris} pie${BESOIN-pris>1?"s":""}. <button class="btn" type="button" id="rej" style="margin-top:8px">Réessayer</button>`;
        $("#rej", el).onclick = partie; } }, 1000));
    lancer(); raf = requestAnimationFrame(boucle);
    nettoyage = arreter;
  };
  el.innerHTML = `<div class="rangee" style="justify-content:center"><button class="btn" type="button" id="go">Lancer les pies</button></div>`;
  $("#go", el).onclick = partie;
};

JEUX.tambour = (el, e, fini) => {
  const VITESSE = expert() ? .2 : .13, COUP = expert() ? .045 : .06;
  let err = 0, raf = 0;
  el.innerHTML = `<canvas class="toile" id="cv" style="max-width:360px" aria-label="Le soleil et le loup Sköll"></canvas>
    <div class="jauge" aria-hidden="true"><i id="jg"></i></div>
    <div class="msg" id="msg">Prêt ? Le loup arrive…</div>
    <button class="btn frappe" type="button" id="fr">Commencer</button>`;
  const cv = $("#cv", el), x = cv.getContext("2d"), N = 360; cv.width = N; cv.height = N;
  const rnd = graine(9), fond = Array.from({length:60}, () => [rnd()*N, rnd()*N, rnd()+.2]);
  let ombre = .35, enCours = false, dernier = 0, secousse = 0;
  const dessiner = () => {
    const nuit = ombre;
    x.fillStyle = `rgb(${Math.round(40-30*nuit)},${Math.round(60-50*nuit)},${Math.round(110-90*nuit)})`; x.fillRect(0,0,N,N);
    fond.forEach(([px,py,r]) => { x.fillStyle=`rgba(243,234,212,${nuit*.8})`; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); });
    const c = N/2, R = 90, dx = (1-ombre)*R*2.1 + (Math.random()-.5)*secousse;
    const g = x.createRadialGradient(c,c,R*.6,c,c,R*1.8); g.addColorStop(0,`rgba(255,220,140,${.6*(1-nuit)+.2})`); g.addColorStop(1,"rgba(255,200,120,0)");
    x.fillStyle=g; x.beginPath(); x.arc(c,c,R*1.8,0,7); x.fill();
    x.fillStyle="#ffd77a"; x.beginPath(); x.arc(c,c,R,0,7); x.fill();
    x.fillStyle="#0b0a12"; x.beginPath(); x.arc(c+dx,c-dx*.15,R*1.02,0,7); x.fill();
    x.fillStyle="#ff5a3c"; [[-22,-14],[10,-14]].forEach(([ox,oy])=>{ x.beginPath(); x.arc(c+dx+ox+6,c-dx*.15+oy,4.5,0,7); x.fill(); });
    x.fillStyle="rgba(243,234,212,.85)"; x.font="16px Poppins, sans-serif"; x.textAlign="center"; x.fillText("Sköll", c+dx, c-dx*.15+R*.55);
    $("#jg", el).style.width = Math.round(ombre*100) + "%";
    secousse *= .85;
  };
  const boucle = t => {
    const dt = dernier ? (t-dernier)/1000 : 0; dernier = t;
    ombre = Math.min(1, ombre + VITESSE*dt); dessiner();
    if(ombre >= 1){ enCours = false; err += 2; son("ko"); const m=$("#msg", el); m.className="msg ko"; m.textContent="Sköll a avalé le soleil ! Reprends ton souffle et recommence.";
      $("#fr", el).textContent = "Recommencer"; return; }
    if(ombre <= 0){ enCours = false; son("ok"); ombre = 0; dessiner(); const m=$("#msg", el); m.className="msg ok"; m.textContent="Sköll lâche prise : la lumière revient !";
      $("#fr", el).disabled = true; setTimeout(()=>fini(err), 1400); return; }
    raf = requestAnimationFrame(boucle);
  };
  const frapper = ev => {
    if(ev) ev.preventDefault();
    if(!enCours){ if($("#fr", el).disabled) return; enCours = true; ombre = .35; dernier = 0; $("#fr", el).textContent = "Frappe le bouclier !";
      const m=$("#msg", el); m.className="msg"; m.textContent="Frappe, frappe, frappe !"; raf = requestAnimationFrame(boucle); return; }
    ombre = Math.max(0, ombre - COUP); secousse = 14; son("boum");
  };
  $("#fr", el).addEventListener("pointerdown", frapper);
  $("#fr", el).addEventListener("keydown", ev => { if(ev.key===" "||ev.key==="Enter") frapper(ev); });
  $("#fr", el).addEventListener("click", ev => ev.preventDefault());
  dessiner();
  nettoyage = () => cancelAnimationFrame(raf);
};

/* =====================================================================
   ÉNIGME FINALE
   ===================================================================== */
function vueFinale(){
  viderVue();
  const reussis = CONTES.filter(conteFini);
  if(reussis.length < 10){
    APP.innerHTML = `<section class="hero"><div class="label">L'énigme finale</div><h1 style="font-size:clamp(36px,7vw,56px)">Le mot des étoiles</h1>
      <p>Chaque conte réussi te donne une lettre. Avec les dix lettres, tu pourras former le mot secret de la Nuit Étoilée.</p></section>
      <div class="lettres" style="justify-content:center;margin:20px 0">${CONTES.map(c=>`<span class="${conteFini(c)?"ok":""}" style="width:40px;height:50px;font-size:24px">${conteFini(c)?c.lettre:"?"}</span>`).join("")}</div>
      <p style="text-align:center">Il te reste <b style="color:var(--or-vif)">${10-reussis.length}</b> conte${10-reussis.length>1?"s":""} à réussir :</p>
      <div class="rangee" style="justify-content:center">${CONTES.filter(c=>!conteFini(c)).map(c=>`<a class="btn fantome" href="#conte-${c.id}">${c.num} · ${esc(c.titre)}</a>`).join("")}</div>`;
    return;
  }
  if(S.finale){ diplome(); return; }
  const reserve = CONTES.map((c,i)=>({l:c.lettre, i})), place = Array(10).fill(null);
  let err = 0;
  const rendu = () => {
    APP.innerHTML = `<section class="hero"><div class="label">L'énigme finale</div><h1 style="font-size:clamp(36px,7vw,56px)">Le mot des étoiles</h1>
      <p>Tu as les dix lettres ! Remets-les dans le bon ordre pour former le nom de la science qui étudie les étoiles, les planètes et tout ce que tu as regardé ce soir.</p></section>
      <div style="display:grid;gap:18px;margin-top:10px">
        <div class="emplacements" aria-label="Ton mot">${place.map((p,k)=>`<button type="button" data-p="${k}" class="${p!==null?"plein":""}" aria-label="Case ${k+1}${p!==null?" : "+reserve[p].l:""}">${p!==null?reserve[p].l:""}</button>`).join("")}</div>
        <div class="reserve" aria-label="Lettres disponibles">${reserve.map((r,k)=>`<button type="button" data-r="${k}" ${place.includes(k)?"disabled":""}>${r.l}</button>`).join("")}</div>
        <div class="msg" id="msg"></div>
        <div class="rangee" style="justify-content:center"><button class="btn fantome" type="button" id="vider">Tout effacer</button><button class="btn fantome" type="button" id="ind">Un indice</button></div>
      </div>`;
    APP.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const k = place.indexOf(null); if(k<0) return; place[k] = +b.dataset.r; son("tic"); verifier(); });
    APP.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { place[+b.dataset.p] = null; rendu(); });
    $("#vider").onclick = () => { place.fill(null); rendu(); };
    $("#ind").onclick = () => { const m=$("#msg"); m.className="msg"; m.textContent = "Le mot commence par « ASTRO », comme astronaute."; };
  };
  const verifier = () => {
    rendu();
    if(place.includes(null)) return;
    const mot = place.map(p=>reserve[p].l).join("");
    if(mot === MOT_FINAL){ son("victoire"); S.finale = {date: new Date().toISOString(), mode:S.mode, etoiles: totalEtoiles(), err}; sauver(); setTimeout(diplome, 600); }
    else { err++; son("ko"); const m=$("#msg"); m.className="msg ko"; m.textContent = "Ce n'est pas encore le bon mot. Touche une case pour retirer sa lettre."; }
  };
  rendu();
}
function diplome(){
  viderVue();
  const f = S.finale, d = new Date(f.date);
  let h = 7; for(const ch of f.date + f.etoiles) h = (h*31 + ch.charCodeAt(0)) % 9000;
  const code = "NE-" + (1000 + h);
  APP.innerHTML = `<section style="margin-top:20px" class="diplome">
    <div class="label">Constellation complète</div>
    <div class="sep" aria-hidden="true">✦ ⋆ ✧ ⋆ ✦</div>
    <div class="mot">${MOT_FINAL}</div>
    <p style="max-width:52ch;margin:0">Tu as écouté les dix contes, relevé tous les défis et retrouvé le mot des étoiles. Sous le même ciel, tu es désormais gardien·ne des histoires de la Nuit Étoilée.</p>
    <div style="font-size:30px;color:var(--or-vif)">${totalEtoiles()} / ${maxEtoiles()} ★</div>
    <div class="sourdine" style="font-family:var(--f-label);font-size:14px">Mode ${f.mode==="astronome"?"Astronome":"Petite étoile"} · ${d.toLocaleDateString("fr-FR")} à ${d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</div>
    <div class="code">${code}</div>
    <p class="sourdine" style="margin:0;font-family:var(--f-label);font-size:14px">Montre cet écran à l'accueil de la Nuit Étoilée.</p>
  </section>
  <div class="rangee" style="justify-content:center;margin-top:20px"><a class="btn fantome" href="#accueil">Revoir la carte du ciel</a></div>`;
}

/* =====================================================================
   NAVIGATION, BARRE, FOND ÉTOILÉ
   ===================================================================== */
function majBarre(){
  $("#b-mode-nom").textContent = expert() ? "Astronome" : "Petite étoile";
  $("#b-son-etat").textContent = S.son ? "oui" : "non"; $("#b-son").setAttribute("aria-pressed", S.son);
}
$("#b-mode").onclick = () => { S.mode = expert() ? "etoile" : "astronome"; sauver(); majBarre(); route(); };
$("#b-son").onclick = () => { S.son = !S.son; sauver(); majBarre(); };

function majOnglets(vue){
  const suite = premierAFaire();
  $("#onglet-suite").href = "#" + suite;
  document.querySelectorAll(".onglets a").forEach(a => {
    const actif = a.dataset.onglet === vue || (vue === "conte" && a.dataset.onglet === "contes");
    if(actif) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
function route(){
  if(!SCENE.hidden) fermerScene();
  document.querySelectorAll("#app audio").forEach(a => a.pause());
  const h = location.hash.replace("#","");
  const m = h.match(/^conte-(\d+)$/);
  if(m){ const c = CONTES.find(c=>c.id===+m[1]); if(c){ vueConte(c); window.scrollTo(0,0); majOnglets("conte"); return; } }
  if(h === "finale"){ vueFinale(); window.scrollTo(0,0); majOnglets("finale"); return; }
  if(h === "contes"){ vueListe(); window.scrollTo(0,0); majOnglets("contes"); return; }
  vueAccueil(); majOnglets("accueil");
  if(h === "" || h === "accueil") window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

(function cielFond(){
  const cv = $("#ciel-fond"), x = cv.getContext("2d");
  let et = [];
  const taille = () => { const r = Math.min(2, window.devicePixelRatio||1); cv.width = innerWidth*r; cv.height = innerHeight*r;
    const rnd = graine(5); et = Array.from({length: Math.round(innerWidth*innerHeight/7000)}, () => ({x:rnd()*cv.width, y:rnd()*cv.height, r:(rnd()*1.1+.3)*r, p:rnd()*6, v:rnd()*.8+.3})); };
  const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const peindre = t => { x.clearRect(0,0,cv.width,cv.height);
    et.forEach(s => { const a = calme ? .5 : .35 + .35*Math.sin(t/1000*s.v + s.p); x.fillStyle = `rgba(230,210,160,${a})`; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); });
    if(!calme) requestAnimationFrame(peindre); };
  addEventListener("resize", taille); taille(); requestAnimationFrame(peindre);
})();

/* L'introduction démarre dès l'arrivée sur le site (une fois par visite). Si le navigateur
   bloque le son avant tout geste, elle part au premier toucher de l'écran. */
const intro = (() => {
  const a = $("#intro-audio"), boite = $("#intro-lecteur"), btn = $("#intro-jouer"), etat = $("#intro-etat"), prog = $("#intro-prog");
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
  const vu = () => { try{ return sessionStorage.getItem("ne-intro") === "1"; }catch(e){ return false; } };
  const noter = () => { try{ sessionStorage.setItem("ne-intro", "1"); }catch(e){} };
  const gestes = ["pointerup", "touchend", "click", "keydown"];
  let attend = false;
  const maj = () => {
    const joue = !a.paused && !a.ended;
    btn.innerHTML = joue ? PAUSE : PLAY;
    btn.setAttribute("aria-label", joue ? "Mettre l'introduction en pause" : "Écouter l'introduction");
    boite.classList.toggle("attente", attend && !joue);
    const geste = matchMedia("(pointer: coarse)").matches ? "Touche l'écran" : "Clique n'importe où";
    etat.textContent = joue ? "La voix du conteur vous accueille" : attend ? geste + " pour lancer la voix du conteur" : "En pause";
  };
  const auGeste = ev => {
    if(ev.target.closest && ev.target.closest("#intro-stop")) return;
    retirer(); jouer();
  };
  const retirer = () => { attend = false; gestes.forEach(g => document.removeEventListener(g, auGeste, true)); };
  const jouer = () => {
    boite.hidden = false; noter();
    const p = a.play();
    if(p && p.catch) p.then(maj).catch(() => { attend = true; gestes.forEach(g => document.addEventListener(g, auGeste, true)); maj(); });
    maj();
  };
  const fermer = () => { retirer(); a.pause(); boite.hidden = true; noter(); };
  btn.onclick = ev => { ev.stopPropagation(); retirer(); a.paused ? jouer() : (a.pause(), maj()); };
  $("#intro-stop").onclick = ev => { ev.stopPropagation(); fermer(); };
  a.addEventListener("play", maj); a.addEventListener("pause", maj);
  a.addEventListener("timeupdate", () => { if(a.duration) prog.style.transform = `scaleX(${a.currentTime / a.duration})`; });
  a.addEventListener("ended", () => { boite.hidden = true; a.currentTime = 0; });
  // Quand un conte ou un autre son démarre, l'introduction s'efface
  document.addEventListener("play", ev => { if(ev.target !== a && !a.paused) a.pause(); }, true);
  return { jouer, fermer, demarrer: () => { if(!vu()) jouer(); } };
})();

majBarre();
route();
intro.demarrer();
</script>
